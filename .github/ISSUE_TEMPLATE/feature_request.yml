name: 'Feature request'
description: Something Diffine should be able to do and cannot.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Before you open this, please:

        - Check the API at https://diffine.cdget.com/api/. Much of what the components do is already a prop.
        - Search for a request that already says it.
        - Open one issue per request.
        - Write in English, and give a title somebody else would search for.
  - type: textarea
    attributes:
      label: What you want to be able to do
      description: |
        Describe it as the thing you are trying to build rather than as the change you have in mind, where you can. The problem is usually easier to agree on than the solution, and it often has more than one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you do instead today
      description: How you work around it now, and what that costs. A workaround that is merely ugly and one that is impossible are different cases.
  - type: dropdown
    attributes:
      label: Which part
      options:
        - 'DiffineViewer'
        - 'DiffineEditor'
        - 'The comparison itself (diffText, diffWords, diffCharacters, diffSequence)'
        - 'The stylesheet, the palette or the custom properties'
        - 'The documentation site'
        - 'Not sure'
